[project]
name = "flagwatch"
version = "0.1.0"
description = "Private CTF discovery, rule analysis, and alert dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.13",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "tzdata>=2025.2",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.scripts]
flagwatch = "flagwatch.cli:app"

[dependency-groups]
dev = [
  "axe-playwright-python>=0.1.8",
  "azure-functions>=2.2.0",
  "azure-identity>=1.25.3",
  "azure-storage-blob>=12.30.0",
  "httpx2>=2.10",
  "mypy>=1.17",
  "playwright>=1.54",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-playwright>=0.9",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flagwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["flagwatch"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
