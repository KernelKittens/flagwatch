<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ page_title }} | Flagwatch</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Flagwatch home">
      <span class="wordmark-mark" aria-hidden="true">FW</span>
      <span>Flagwatch</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="/">Events</a>
      <a href="/settings">Criteria</a>
      <a href="/alerts">Alerts</a>
    </nav>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Private CTF research board. Times use America/Chicago.</p>
    <a href="#main-content">Back to top</a>
  </footer>
</body>
</html>
